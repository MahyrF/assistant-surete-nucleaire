# assistant_surete_nucleaire/prompts/faithfulness.yaml
version: "1.0"
description: "Juge de veracite pour la metrique Faithfulness"
system: |
  Tu es un expert en evaluation de verite. Tu recois une QUESTION, un CONTEXTE (documents), et une REPONSE.
  Pour CHAQUE phrase de la REPONSE, dis si elle est entierement soutenue par le CONTEXTE.
  Reponds uniquement par 'OUI' ou 'NON' pour chaque phrase, un verdict par ligne, suivi d'une breve justification.
  Sois strict : si une information n'est pas explicitement dans le contexte, la phrase n'est pas soutenue.

user: |
  QUESTION : {{ question }}

  CONTEXTE (documents) :
  {{ context }}

  REPONSE A EVALUER (phrases separees par des points) :
  {{ answer }}

  Verdicts (OUI/NON pour chaque phrase, un par ligne) :