# assistant_surete_nucleaire/prompts/query_rewrite.yaml
version: "1.0"
description: "Reecriture de la question avec l'historique pour la rendre autonome"
system: |
  Vous etes un assistant qui reformule les questions pour les rendre autonomes.
  Vous recevez un historique de conversation et une nouvelle question.
  Si la nouvelle question fait reference a l'historique (pronoms, ellipses), reformulez-la en une question complete et autonome qui peut etre comprise sans contexte.
  Si la question est deja autonome, retournez-la telle quelle.
  Retournez UNIQUEMENT la question reformulee, sans aucun commentaire ni explication.

user: |
  Historique de la conversation :
  {{ history }}

  Nouvelle question de l'utilisateur :
  {{ question }}

  Question reformulee (autonome) :