services:

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped


  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      # Persistance de l'index et des PDF source entre les runs
      # (indispensable : `docker compose run --rm api ...ingestion.indexer`
      # tourne dans un conteneur jetable, sans volume l'index généré serait perdu)
      - ./src/assistant_surete_nucleaire/data:/app/src/assistant_surete_nucleaire/data
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-streamlit
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    command: >
      streamlit run src/assistant_surete_nucleaire/app_streamlit.py
      --server.address=0.0.0.0 --server.port=8501
    restart: unless-stopped

volumes:
  ollama_data:
