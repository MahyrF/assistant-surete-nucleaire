services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  api:
    build: .
    container_name: rag-api
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./src/assistant_surete_nucleaire/data:/app/src/assistant_surete_nucleaire/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  streamlit:
    build: .
    container_name: rag-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - PYTHONPATH=/app/src
    volumes:
      - ./src/assistant_surete_nucleaire/data:/app/src/assistant_surete_nucleaire/data
    command: /app/wait-for-it.sh api:8000 --timeout=10 --strict -- streamlit run /app/src/assistant_surete_nucleaire/app_streamlit.py --server.address=0.0.0.0 --server.port=8501
    restart: unless-stopped

volumes:
  ollama_data:
